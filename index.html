<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фриил - короткие видео</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Экран загрузки -->
        <div id="loading-screen" class="loading-screen">
            <div class="loader"></div>
            <h2>Фриил</h2>
            <p>Загрузка...</p>
        </div>

        <!-- Экран авторизации -->
        <div id="auth-screen" class="auth-screen hidden">
            <div class="auth-container">
                <h1 class="logo">Фриил</h1>
                <p class="logo-subtitle">Короткие видео</p>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Вход</button>
                    <button class="tab-btn" data-tab="register">Регистрация</button>
                </div>

                <!-- Форма входа -->
                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="auth-btn">Войти</button>
                </form>

                <!-- Форма регистрации -->
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="register-username" placeholder="Имя пользователя" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="register-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="register-password" placeholder="Пароль" required minlength="6">
                    </div>
                    <button type="submit" class="auth-btn">Зарегистрироваться</button>
                </form>

                <div id="auth-error" class="auth-error hidden"></div>
            </div>
        </div>

        <!-- Основное приложение -->
        <div id="main-app" class="main-app hidden">
            <!-- Видео лента -->
            <div id="video-feed" class="video-feed">
                <!-- Видео будут загружаться сюда -->
            </div>

            <!-- Нижняя навигация -->
            <nav class="bottom-nav">
                <button class="nav-btn active" data-view="feed">
                    <i class="fas fa-home"></i>
                    <span>Главная</span>
                </button>
                <button class="nav-btn" data-view="upload">
                    <i class="fas fa-plus-circle"></i>
                    <span>Загрузить</span>
                </button>
                <button class="nav-btn" data-view="profile">
                    <i class="fas fa-user"></i>
                    <span>Профиль</span>
                </button>
            </nav>

            <!-- Модальное окно загрузки видео -->
            <div id="upload-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Загрузить видео</h2>
                        <button class="close-modal">&times;</button>
                    </div>
                    <form id="upload-form">
                        <div class="upload-area" id="drop-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Нажмите для выбора видео или перетащите файл</p>
                            <p class="file-info">Максимум 50MB</p>
                            <input type="file" id="video-file" accept="video/*" hidden>
                        </div>
                        <div class="form-group">
                            <textarea id="video-description" placeholder="Описание видео (необязательно)" rows="3"></textarea>
                        </div>
                        <button type="submit" class="upload-btn" disabled>Загрузить</button>
                    </form>
                </div>
            </div>

            <!-- Модальное окно комментариев -->
            <div id="comments-modal" class="modal hidden">
                <div class="modal-content comments-modal">
                    <div class="modal-header">
                        <h2>Комментарии</h2>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div id="comments-list" class="comments-list"></div>
                    <div class="add-comment">
                        <input type="text" id="comment-text" placeholder="Напишите комментарий...">
                        <button id="send-comment"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
